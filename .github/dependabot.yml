version: 2
updates:
  # Go modules - grouped into a single weekly PR
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[CHORE]"
    groups:
      go-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      go-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # npm packages - grouped by category into fewer PRs
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "[CHORE]"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
    # Ignore tailwindcss v4 - requires dedicated migration
    ignore:
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]

  # GitHub Actions - all grouped into one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "[CHORE]"
    groups:
      actions-all:
        patterns:
          - "*"
