# Air configuration for hot reload
# Documentation: https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Main entry point
  cmd = "go build -o ./tmp/server ./cmd/server"
  # Binary output
  bin = "./tmp/server"
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Exclude directories
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
  # Exclude files
  exclude_file = []
  # Exclude patterns
  exclude_regex = ["_test.go"]
  # Exclude unchanged files
  exclude_unchanged = false
  # Follow symlinks
  follow_symlink = false
  # Log file
  log = "build-errors.log"
  # Poll interval for watching (in ms)
  poll = false
  poll_interval = 0
  # Delay before rebuild (in ms)
  delay = 1000
  # Stop running old binary before building
  stop_on_error = false
  # Send interrupt signal before killing
  send_interrupt = true
  # Delay after interrupt (in ms)
  kill_delay = 500
  # Rerun binary after build
  rerun = false
  rerun_delay = 500
  # Arguments to pass to binary
  args_bin = []

[log]
  # Log time
  time = false
  # Main log (colored)
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean tmp on exit
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
